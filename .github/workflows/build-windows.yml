name: Build VST3 (Windows x64)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target CrayAutoTune_VST3 --parallel
      - name: Test DSP (sin DAW)
        run: |
          cmake --build build --config Release --target dsp_test
          ./build/Release/dsp_test.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CrayAutoTune-VST3-x64
          path: build/CrayAutoTune_artefacts/Release/VST3/
